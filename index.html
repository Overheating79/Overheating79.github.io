<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Tools</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 40px 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #555;
      margin-bottom: 32px;
    }
    a.card {
      display: block;
      background: #fff;
      border: 1px solid #d5dbe1;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      text-decoration: none;
      color: #1a4f8b;
      font-size: 1.2em;
      font-weight: bold;
    }
    a.card:hover {
      background: #e8f0fa;
      border-color: #1a4f8b;
    }
    a.card span {
      display: block;
      margin-top: 6px;
      font-size: 0.8em;
      font-weight: normal;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tournament Tools</h1>
    <p class="subtitle">Pick a tool to get started.</p>

    <a class="card" href="TournamentPayoutCalculator.html">
      Tournament Payout Calculator
      <span>Work out how a prize pool gets paid out.</span>
    </a>

    <a class="card" href="TwoLossTournament.html">
      Two Loss Tournament
      <span>Run a two-loss (double elimination style) bracket.</span>
    </a>
  </div>

</html>

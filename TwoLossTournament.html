<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Double Elimination Non-Bracket style tournament (Card Draw)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: two columns on wide screens (rounds on the left, live standings on the right), stacked on a phone. */
:root {
  --bg: #f4f7f5;
  --surface: #ffffff;
  --fg: #16201b;
  --muted: #5b6a62;
  --line: #d9e2dc;
  --accent: #1d6b4d;
  --accent-fg: #ffffff;
  --win-bg: #e0f1e8;
  --loss: #9a5200;
  --loss-bg: #fcefd9;
  --out: #7b857f;
  --out-bg: #e8ece9;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --surface: #171f1a; --fg: #e7eee9; --muted: #98a79f; --line: #29352e;
    --accent: #4cc38a; --accent-fg: #07130d; --win-bg: #15321f; --loss: #f2aa4c; --loss-bg: #392a10;
    --out: #85908a; --out-bg: #222b25; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --surface: #171f1a; --fg: #e7eee9; --muted: #98a79f; --line: #29352e;
  --accent: #4cc38a; --accent-fg: #07130d; --win-bg: #15321f; --loss: #f2aa4c; --loss-bg: #392a10;
  --out: #85908a; --out-bg: #222b25; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
header.top p { margin-top: 4px; max-width: 60ch; }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.panel + .panel { margin-top: 16px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }

button, input, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.primary:disabled { background: var(--out-bg); color: var(--muted); border-color: var(--line); opacity: 1; }
button.ghost { background: transparent; }
button.danger-armed { border-color: var(--loss); color: var(--loss); background: var(--loss-bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type="text"], textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
}
textarea { min-height: 84px; resize: vertical; }
label.lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.row { display: flex; gap: 8px; }
.row > input { flex: 1; min-width: 0; }
.stack { display: grid; gap: 16px; }
.msg { min-height: 20px; font-size: 13px; color: var(--loss); margin-top: 6px; }

.banner { background: var(--loss-bg); color: var(--loss); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
.banner.champ { background: var(--win-bg); color: var(--accent); font-size: 15px; padding: 14px; margin-bottom: 14px; }
.banner.champ strong { font-family: var(--font-display); font-size: 22px; display: block; color: var(--fg); }

.roster { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.roster li { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 12px; }
.roster button { border: 0; background: transparent; padding: 2px 8px; color: var(--muted); border-radius: 999px; }
.roster button:hover { color: var(--loss); }

.nm { font-weight: 600; overflow-wrap: anywhere; }
.nm.one { color: var(--loss); text-decoration: underline dotted; text-underline-offset: 4px; }
.nm.out { color: var(--out); text-decoration: line-through; font-weight: 500; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 7px; border-radius: 999px; margin-left: 8px; vertical-align: 1px; white-space: nowrap; }
.chip.one { background: var(--loss-bg); color: var(--loss); }
.chip.out { background: var(--out-bg); color: var(--out); }
.chip.win { background: var(--win-bg); color: var(--accent); }

.matches { display: grid; gap: 12px; }
.match { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.match .mlabel { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 8px 12px 0; }
.side { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; }
.side + .side { border-top: 1px solid var(--line); }
.side.won { background: var(--win-bg); }
.side.lost .who { opacity: 0.75; }
.side button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.bye { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }

details.past { border-top: 1px solid var(--line); padding: 10px 0; }
details.past summary { cursor: pointer; font-weight: 600; }
details.past ul { margin: 8px 0 0; padding-left: 18px; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.place { font-family: var(--font-display); font-weight: 600; white-space: nowrap; width: 1%; }
tr:last-child td { border-bottom: 0; }
td.rec, th.rec { white-space: nowrap; }
.sr { position: absolute; left: -9999px; }
@media (prefers-reduced-motion: no-preference) { button { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Double Elimination Non-Bracket style tournament (Card Draw)</h1>
      <p class="muted">Draw each round at random, mark the winners, and watch the standings update. A second loss knocks a player out.</p>
    </div>
    <button id="reset" class="ghost" type="button">Start over</button>
  </header>

  <div class="layout">
    <section id="main" aria-live="polite"></section>
    <aside id="standings"></aside>
  </div>
</div>

<script>
(function () {
  var KEY = "twoLossTournament.v2";
  var SAMPLE = ["Marcus", "Dana", "Luis", "Priya", "Tom", "Keisha", "Ray", "Nadia", "Colt"];
  var state = load() || fresh();
  if (!Array.isArray(state.playoffs)) state.playoffs = [];
  var resetArmed = false, resetTimer = null, addMessage = "";
  var backArmed = false, backTimer = null;

  function fresh() {
    return { phase: "setup", sample: false, players: [], rounds: [], playoffs: [] };
  }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.players) && Array.isArray(s.rounds)) return s; } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function randInt(n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = randInt(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function ordinal(n) {
    var m = n % 100;
    if (m >= 11 && m <= 13) return n + "th";
    return n + (["th", "st", "nd", "rd"][n % 10] || "th");
  }
  function byId(id) { return state.players.filter(function (p) { return p.id === id; })[0]; }

  /* Everything below is derived from the list of rounds, so changing a winner always stays consistent. */
  function compute() {
    var s = {};
    state.players.forEach(function (p) { s[p.id] = { w: 0, l: 0, b: 0, elim: null }; });
    state.rounds.forEach(function (r, i) {
      r.matches.forEach(function (m) {
        if (!m.w) return;
        var loser = m.w === m.a ? m.b : m.a;
        s[m.w].w++; s[loser].l++;
        if (s[loser].l === 2) s[loser].elim = i + 1;
      });
      if (r.bye) { s[r.bye].w++; s[r.bye].b++; }
    });
    return s;
  }
  function roundDone(r) { return r.matches.every(function (m) { return !!m.w; }); }
  function aliveList(st) { return state.players.filter(function (p) { return st[p.id].l < 2; }); }

  function drawRound() {
    var st = compute(), alive = aliveList(st), bye = null;
    var prev = state.rounds[state.rounds.length - 1];
    var prevBye = null;
    if (prev && prev.bye && alive.some(function (p) { return p.id === prev.bye; })) prevBye = prev.bye;
    if (alive.length % 2 === 1) {
      /* Never give the same player back-to-back byes (unless they are the only one who could take it). */
      var cands = alive.filter(function (p) { return p.id !== prevBye; });
      if (!cands.length) cands = alive;
      var least = Math.min.apply(null, cands.map(function (p) { return st[p.id].b; }));
      var pool = cands.filter(function (p) { return st[p.id].b === least; });
      bye = pool[randInt(pool.length)].id;
    }
    var rest = alive.filter(function (p) { return p.id !== bye; });
    var forced = prevBye && prevBye !== bye ? rest.filter(function (p) { return p.id === prevBye; }) : [];
    var field = forced.concat(shuffle(rest.filter(function (p) { return p.id !== prevBye || !forced.length; })));
    var matches = [];
    for (var i = 0; i + 1 < field.length; i += 2) matches.push({ a: field[i].id, b: field[i + 1].id, w: null });
    state.rounds.push({ matches: matches, bye: bye });
  }

  function key(p, st) {
    var x = st[p.id];
    return x.l >= 2 ? [1, -x.elim, -x.w] : [0, x.l, -x.w];
  }
  function cmp(a, b) { for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; }
  /* Playoff wins only count between players who are level on everything else (so stale playoffs are ignored). */
  function playoffWins(st) {
    var bk = {}, pw = {};
    state.players.forEach(function (p) { bk[p.id] = key(p, st); pw[p.id] = 0; });
    state.playoffs.forEach(function (m) {
      if (!m.w || !bk[m.a] || !bk[m.b] || cmp(bk[m.a], bk[m.b]) !== 0) return;
      pw[m.w]++;
    });
    return pw;
  }
  function standings(st) {
    var pw = playoffWins(st);
    var rows = state.players.map(function (p) { return { p: p, k: key(p, st).concat(-pw[p.id]) }; });
    rows.sort(function (x, y) { return cmp(x.k, y.k) || x.p.name.localeCompare(y.p.name); });
    rows.forEach(function (r, i) {
      r.rank = i + 1;
      if (i > 0 && cmp(rows[i - 1].k, r.k) === 0) r.rank = rows[i - 1].rank;
    });
    rows.forEach(function (r) { r.tied = rows.filter(function (o) { return o.rank === r.rank; }).length > 1; });
    return rows;
  }

  function tieGroups(rows) {
    var groups = [];
    rows.forEach(function (r) {
      if (!r.tied) return;
      var g = groups.filter(function (x) { return x.rank === r.rank; })[0];
      if (!g) { g = { rank: r.rank, rows: [] }; groups.push(g); }
      g.rows.push(r);
    });
    return groups;
  }
  function inGroup(g, id) { return g.rows.some(function (r) { return r.p.id === id; }); }
  function isFinished(st) { var last = state.rounds[state.rounds.length - 1]; return !!last && aliveList(st).length === 1 && roundDone(last); }

  /* Ties for 1st to 3rd must be settled by playoff matches; lower ties can optionally be broken the same way. */
  function playoffPanel(st) {
    var rows = standings(st), groups = tieGroups(rows);
    var required = groups.filter(function (g) { return g.rank <= 3; });
    var h = '<div class="panel"><div class="panel-head"><h2>Tiebreak playoffs</h2><span class="muted small">' +
      (required.length ? "Needed to settle the podium" : "Podium places are settled") + "</span></div>";
    if (required.length) h += '<div class="banner">Two players cannot share a podium place. Draw a playoff match for each tie below and mark the winner.</div>';
    else h += '<p style="margin-bottom:12px"><strong>' + rows.slice(0, 3).map(function (r) { return ordinal(r.rank) + " " + esc(r.p.name); }).join(" &middot; ") + "</strong></p>";
    groups.forEach(function (g) {
      var req = g.rank <= 3;
      var pending = state.playoffs.some(function (m) { return !m.w && inGroup(g, m.a) && inGroup(g, m.b); });
      h += '<div class="bye" style="margin-top:0;margin-bottom:12px"><strong>Tied for ' + ordinal(g.rank) + (req ? "" : " (optional)") + ":</strong> " +
        g.rows.map(function (r) { return esc(r.p.name); }).join(", ");
      if (pending) h += ' <span class="muted small">&middot; mark the playoff winner below.</span>';
      else h += '<div class="actions" style="margin-top:8px"><button type="button" class="' + (req ? "primary" : "ghost") + '" data-act="pdraw" data-rank="' + g.rank + '">' +
        (g.rows.length === 2 ? "Draw playoff match" : "Draw playoff round robin") + "</button>" +
        (req ? "" : '<span class="muted small">Not required. If you skip it, these players share the place.</span>') + "</div>";
      h += "</div>";
    });
    if (state.playoffs.length) {
      h += '<div class="matches">';
      state.playoffs.forEach(function (m, i) {
        h += '<div class="match"><div class="mlabel">Playoff match ' + (i + 1) + "</div>";
        [m.a, m.b].forEach(function (id) {
          var p = byId(id), won = m.w === id, lost = m.w && m.w !== id;
          h += '<div class="side' + (won ? " won" : "") + (lost ? " lost" : "") + '"><div class="who"><span class="nm">' + esc(p.name) + "</span></div>" +
            '<button type="button" data-act="pwin" data-i="' + i + '" data-p="' + id + '" aria-pressed="' + (won ? "true" : "false") + '">' + (won ? "Winner" : "Mark winner") + "</button></div>";
        });
        h += "</div>";
      });
      h += '</div><div class="actions"><button id="pclear" type="button" class="ghost">Clear all playoffs</button></div>';
    }
    return h + "</div>";
  }

  function nm(p, st) {
    var x = st[p.id], cls = x.l >= 2 ? "out" : x.l === 1 ? "one" : "";
    var chip = x.l >= 2 ? '<span class="chip out">Out</span>' : x.l === 1 ? '<span class="chip one">1 loss</span>' : "";
    return '<span class="nm ' + cls + '">' + esc(p.name) + "</span>" + chip;
  }

  function render() {
    var st = compute();
    renderMain(st);
    renderStandings(st);
    $("reset").hidden = state.phase === "setup" && state.players.length === 0;
    save();
  }
  function $(id) { return document.getElementById(id); }

  function renderMain(st) {
    var h = "";
    if (state.phase === "setup") {
      var n = state.players.length;
      h += '<div class="panel"><div class="panel-head"><h2>Players</h2><span class="muted small">' + n + (n === 1 ? " player" : " players") + "</span></div>";
      if (state.sample) h += '<div class="banner">These are example players so you can see how it works. Clear them, then enter your own.</div>';
      h += '<div class="stack"><form id="add-form"><label class="lbl" for="player-name">Add a player</label>' +
        '<div class="row"><input id="player-name" type="text" autocomplete="off" placeholder="Player name"><button class="primary" type="submit">Add</button></div>' +
        '<div class="msg" id="add-msg">' + esc(addMessage) + "</div></form>" +
        '<div><label class="lbl" for="bulk">Or paste a list, one name per line</label><textarea id="bulk" placeholder="Name one&#10;Name two"></textarea>' +
        '<div class="actions" style="margin-top:8px"><button id="bulk-add" type="button">Add all</button>' +
        '<button id="clear-all" type="button" class="ghost"' + (n ? "" : " disabled") + ">Clear all players</button></div></div>";
      if (n) {
        h += '<ul class="roster">' + state.players.map(function (p) {
          return "<li><span>" + esc(p.name) + '</span><button type="button" data-act="remove" data-p="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">&times;</button></li>';
        }).join("") + "</ul>";
      }
      h += '<div><button id="start" class="primary" type="button"' + (n < 2 ? " disabled" : "") + ">Shuffle and draw round 1</button>" +
        '<p class="muted small" style="margin-top:8px">' + (n < 2 ? "Add at least two players to begin." : (n % 2 ? "With an odd number of players, one player gets a bye each round and moves on without playing." : "Everyone will have a match in round 1.")) + "</p></div>";
      h += "</div></div>";
    } else {
      var alive = aliveList(st), last = state.rounds[state.rounds.length - 1], done = roundDone(last);
      var champ = alive.length === 1 && done;
      var marked = last.matches.filter(function (m) { return m.w; }).length;
      if (champ) h += '<div class="banner champ">Champion<strong>' + esc(alive[0].name) + "</strong></div>";
      h += '<div class="panel"><div class="panel-head"><h2>Round ' + state.rounds.length + '</h2><span class="muted small">' + marked + " of " + last.matches.length + " results in &middot; " + alive.length + " still in</span></div>";
      h += '<div class="matches">';
      last.matches.forEach(function (m, i) {
        h += '<div class="match"><div class="mlabel">Match ' + (i + 1) + ((i === 0 && state.rounds.length > 1 && state.rounds[state.rounds.length - 2].bye && state.rounds[state.rounds.length - 2].bye === m.a) ? " &middot; had a bye last round" : "") + "</div>";
        [m.a, m.b].forEach(function (id) {
          var p = byId(id), won = m.w === id, lost = m.w && m.w !== id;
          h += '<div class="side' + (won ? " won" : "") + (lost ? " lost" : "") + '"><div class="who">' + nm(p, st) + (lost ? '<span class="chip out" style="margin-left:8px">Loss</span>' : "") + "</div>" +
            '<button type="button" data-act="win" data-m="' + i + '" data-p="' + id + '" aria-pressed="' + (won ? "true" : "false") + '">' + (won ? "Winner" : "Mark winner") + "</button></div>";
        });
        h += "</div>";
      });
      h += "</div>";
      if (last.bye) h += '<div class="bye">' + nm(byId(last.bye), st) + ' <span class="muted">has a bye and moves on to the next round.</span></div>';
      h += '<div class="actions">';
      if (!champ) {
        h += '<button id="next" class="primary" type="button"' + (done ? "" : " disabled") + ">Shuffle and draw round " + (state.rounds.length + 1) + "</button>";
        if (!done) h += '<span class="muted small">Mark every winner to continue.</span>';
        if (marked === 0) h += '<button id="redraw" type="button" class="ghost">Reshuffle this round</button>';
      }
      var backLabel = state.rounds.length > 1 ? "Go back to round " + (state.rounds.length - 1) : "Back to player setup";
      if (backArmed) backLabel = marked ? "Click again to discard round " + state.rounds.length : backLabel;
      h += '<button id="back" type="button" class="ghost' + (backArmed ? ' danger-armed' : '') + '">&larr; ' + backLabel + "</button>";
      h += "</div></div>";
      if (champ) h += playoffPanel(st);
      var past = state.rounds.slice(0, -1);
      if (past.length) {
        h += '<div class="panel"><h3 style="margin-bottom:6px">Earlier rounds</h3>';
        for (var i = past.length - 1; i >= 0; i--) {
          var r = past[i];
          h += '<details class="past"><summary>Round ' + (i + 1) + "</summary><ul>" + r.matches.map(function (m) {
            var w = byId(m.w), l = byId(m.w === m.a ? m.b : m.a);
            return "<li><strong>" + esc(w.name) + "</strong> beat " + esc(l.name) + "</li>";
          }).join("") + (r.bye ? "<li>" + esc(byId(r.bye).name) + " had a bye</li>" : "") + "</ul></details>";
        }
        h += "</div>";
      }
    }
    $("main").innerHTML = h;
  }

  function renderStandings(st) {
    var any = state.rounds.some(function (r) { return r.matches.some(function (m) { return m.w; }); });
    var h = '<div class="panel"><div class="panel-head"><h2>Standings</h2></div>';
    if (state.phase === "setup") {
      h += '<p class="muted">Standings start once the first round is drawn. Players still in are ranked by losses, and players who are out are ranked by how long they lasted.</p></div>';
      $("standings").innerHTML = h; return;
    }
    var rows = standings(st);
    h += '<div class="tablewrap"><table><thead><tr><th>Place</th><th>Player</th><th class="rec">W&ndash;L</th><th>Status</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var x = st[r.p.id], status;
      var champ = r.rank === 1 && aliveList(st).length === 1 && roundDone(state.rounds[state.rounds.length - 1]) && x.l < 2;
      if (champ) status = '<span class="chip win" style="margin-left:0">Champion</span>';
      else if (x.l >= 2) status = "Out in round " + x.elim;
      else if (x.l === 1) status = "In, 1 loss";
      else status = any ? "In, no losses" : "In";
      if (r.tied && r.rank <= 3 && isFinished(st)) status = "Tied, playoff needed";
      h += "<tr><td class=\"place\">" + (any ? (r.tied ? "T-" : "") + ordinal(r.rank) : "&ndash;") + "</td><td>" + nm(r.p, st).replace(/<span class="chip [^"]*">[^<]*<\/span>/, "") + '</td><td class="rec">' + x.w + "&ndash;" + x.l + "</td><td class=\"small muted\">" + status + "</td></tr>";
    });
    h += "</tbody></table></div>";
    h += '<p class="muted small" style="margin-top:12px">A bye counts as a win. Players who go out in the same round are ranked by wins, then by playoff results. Ties for the top three places must be settled with a playoff.</p></div>';
    $("standings").innerHTML = h;
  }

  /* Setup actions */
  function addNames(list) {
    var added = 0, skipped = 0;
    if (state.sample) { state.players = []; state.sample = false; }
    list.forEach(function (raw) {
      var name = raw.replace(/\s+/g, " ").trim();
      if (!name) return;
      var dup = state.players.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); });
      if (dup) { skipped++; return; }
      state.players.push({ id: uid(), name: name }); added++;
    });
    addMessage = skipped ? skipped + (skipped === 1 ? " name was" : " names were") + " already on the list and skipped." : "";
    return added;
  }

  document.addEventListener("submit", function (e) {
    if (e.target.id !== "add-form") return;
    e.preventDefault();
    var v = $("player-name").value;
    addNames([v]); render();
    var f = $("player-name"); if (f) f.focus();
  });

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "remove") {
      state.players = state.players.filter(function (p) { return p.id !== t.getAttribute("data-p"); });
      addMessage = ""; render(); return;
    }
    if (act === "win") {
      var last = state.rounds[state.rounds.length - 1], m = last.matches[+t.getAttribute("data-m")], id = t.getAttribute("data-p");
      m.w = m.w === id ? null : id; state.playoffs = []; render(); return;
    }
    if (act === "pwin") {
      var pm = state.playoffs[+t.getAttribute("data-i")], pid = t.getAttribute("data-p");
      if (pm) { pm.w = pm.w === pid ? null : pid; render(); }
      return;
    }
    if (act === "pdraw") {
      var g = tieGroups(standings(compute())).filter(function (x) { return x.rank === +t.getAttribute("data-rank"); })[0];
      if (g) {
        var ids = shuffle(g.rows.map(function (r) { return r.p.id; }));
        for (var a = 0; a < ids.length; a++) for (var b = a + 1; b < ids.length; b++) state.playoffs.push({ a: ids[a], b: ids[b], w: null });
      }
      render(); return;
    }
    switch (t.id) {
      case "bulk-add": addNames($("bulk").value.split(/\r?\n/)); render(); break;
      case "clear-all": state.players = []; state.sample = false; addMessage = ""; render(); break;
      case "start":
        if (state.players.length < 2) return;
        state.phase = "running"; state.rounds = []; state.playoffs = []; drawRound(); render(); break;
      case "next": drawRound(); render(); break;
      case "redraw": state.rounds.pop(); drawRound(); render(); break;
      case "pclear": state.playoffs = []; render(); break;
      case "back":
        var cur = state.rounds[state.rounds.length - 1];
        var hasMarks = cur && cur.matches.some(function (m) { return m.w; });
        if (hasMarks && !backArmed) {
          backArmed = true; render();
          clearTimeout(backTimer);
          backTimer = setTimeout(function () { backArmed = false; render(); }, 4000);
          break;
        }
        backArmed = false; clearTimeout(backTimer);
        state.rounds.pop(); state.playoffs = [];
        if (!state.rounds.length) state.phase = "setup";
        render(); break;
      case "reset":
        if (!resetArmed) {
          resetArmed = true; t.textContent = "Click again to erase everything"; t.className = "danger-armed";
          clearTimeout(resetTimer);
          resetTimer = setTimeout(disarm, 4000);
        } else {
          disarm(); state = { phase: "setup", sample: false, players: [], rounds: [], playoffs: [] }; addMessage = ""; render();
        }
        break;
    }
  });
  function disarm() { resetArmed = false; var b = $("reset"); b.textContent = "Start over"; b.className = "ghost"; }

  render();
})();
</script>

</body></html>
